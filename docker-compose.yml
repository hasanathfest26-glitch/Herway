version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: herway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: herway
      POSTGRES_PASSWORD: herway_secret
      POSTGRES_DB: herway
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: herway-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
